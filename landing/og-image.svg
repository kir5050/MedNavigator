<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFBFD"/>
      <stop offset="100%" style="stop-color:#E8F0FE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B6EF5"/>
      <stop offset="100%" style="stop-color:#6C3BF5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="200" fill="#1B6EF5" opacity="0.06"/>
  <circle cx="150" cy="530" r="150" fill="#00C896" opacity="0.06"/>

  <!-- Logo icon -->
  <rect x="80" y="80" width="56" height="56" rx="14" fill="#1B6EF5"/>
  <text x="108" y="118" text-anchor="middle" font-size="32" fill="white" font-family="sans-serif" font-weight="bold">M</text>

  <!-- Logo text -->
  <text x="150" y="116" font-size="26" fill="#1A2138" font-family="sans-serif" font-weight="700">Med</text>
  <text x="210" y="116" font-size="26" fill="#1B6EF5" font-family="sans-serif" font-weight="700">Navigator</text>

  <!-- Main heading -->
  <text x="80" y="260" font-size="52" fill="#1A2138" font-family="sans-serif" font-weight="800">Не знаете, к какому</text>
  <text x="80" y="325" font-size="52" fill="url(#accent)" font-family="sans-serif" font-weight="800">врачу идти?</text>

  <!-- Subtitle -->
  <text x="80" y="390" font-size="22" fill="#5A6478" font-family="sans-serif">Опишите симптомы — ИИ подберёт специалиста</text>
  <text x="80" y="420" font-size="22" fill="#5A6478" font-family="sans-serif">и подготовит PDF-выписку для визита к врачу</text>

  <!-- CTA button -->
  <rect x="80" y="460" width="280" height="52" rx="26" fill="#1B6EF5"/>
  <text x="220" y="493" text-anchor="middle" font-size="17" fill="white" font-family="sans-serif" font-weight="600">Проверить симптомы →</text>

  <!-- Tags -->
  <rect x="390" y="466" width="130" height="36" rx="18" fill="#E6FAF4"/>
  <text x="455" y="490" text-anchor="middle" font-size="13" fill="#059669" font-family="sans-serif" font-weight="600">Бесплатно</text>

  <rect x="535" y="466" width="130" height="36" rx="18" fill="#E6FAF4"/>
  <text x="600" y="490" text-anchor="middle" font-size="13" fill="#059669" font-family="sans-serif" font-weight="600">Анонимно</text>

  <!-- Phone mockup (simplified) -->
  <rect x="820" y="120" width="300" height="440" rx="32" fill="#1A2138"/>
  <rect x="832" y="132" width="276" height="416" rx="24" fill="white"/>

  <!-- Notch -->
  <rect x="910" y="132" width="100" height="24" rx="0 0 12 12" fill="#1A2138"/>

  <!-- Chat messages -->
  <rect x="848" y="180" width="200" height="36" rx="12" fill="#F0F4FA"/>
  <text x="860" y="203" font-size="11" fill="#1A2138" font-family="sans-serif">Что вас беспокоит?</text>

  <rect x="948" y="228" width="146" height="36" rx="12" fill="#1B6EF5"/>
  <text x="960" y="251" font-size="11" fill="white" font-family="sans-serif">Болит голова 3 дня</text>

  <rect x="848" y="276" width="180" height="36" rx="12" fill="#F0F4FA"/>
  <text x="860" y="299" font-size="11" fill="#1A2138" font-family="sans-serif">Есть ли температура?</text>

  <rect x="988" y="324" width="106" height="36" rx="12" fill="#1B6EF5"/>
  <text x="1000" y="347" font-size="11" fill="white" font-family="sans-serif">Нет, но тошнит</text>

  <!-- Result card -->
  <rect x="848" y="380" width="246" height="80" rx="12" fill="#E6FAF4"/>
  <rect x="848" y="380" width="3" height="80" rx="1.5" fill="#00C896"/>
  <text x="864" y="402" font-size="9" fill="#059669" font-family="sans-serif" font-weight="700" letter-spacing="0.5">✓ РЕКОМЕНДАЦИЯ</text>
  <text x="864" y="422" font-size="13" fill="#1A2138" font-family="sans-serif" font-weight="600">Невролог</text>
  <text x="864" y="442" font-size="10" fill="#5A6478" font-family="sans-serif">Срочность: 1-2 дня</text>

  <!-- Disclaimer -->
  <text x="600" y="610" text-anchor="middle" font-size="11" fill="#8B95A8" font-family="sans-serif">navimedic.ru · Информационный сервис, не заменяет консультацию врача</text>
</svg>
