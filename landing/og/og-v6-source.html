<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MedNavigator — og.png source (1200×630)</title>
<!--
  Source for landing/og.png (v6.1 redesign, dark ink style per handoff README).
  All visible strings are copied verbatim from landing/index.html. Render with:
  npx playwright screenshot --viewport-size=1200,630 landing/og/og-v6-source.html landing/og.png
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root{
  /* Tokens copied from landing/index.html (v6.1) */
  --bg:#EFEBE0; --surface:#FAF7EE;
  --ink:#1A1714; --ink-text:rgba(250,247,238,0.95); --ink-text-muted:rgba(250,247,238,0.55);
  --copper:#B0593A; --copper-ink:#9A4C31; --copper-soft:rgba(176,89,58,0.10);
  --text-secondary:rgba(26,23,20,0.65); --text-muted:rgba(26,23,20,0.62);
  --border:rgba(26,23,20,0.10); --border-strong:rgba(26,23,20,0.22);
  --radius:6px; --radius-pill:999px;
  --font-sans:'Geist',system-ui,-apple-system,sans-serif;
  --font-serif:'Playfair Display','Georgia',serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
body{
  width:1200px; height:630px;
  background:var(--ink);
  color:var(--ink-text);
  font-family:var(--font-sans);
  position:relative; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* Editorial grid backdrop — as on the dark cards of the landing */
body::before{
  content:''; position:absolute; inset:0;
  background-image:linear-gradient(rgba(250,247,238,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(250,247,238,0.04) 1px,transparent 1px);
  background-size:80px 80px;
  mask-image:radial-gradient(ellipse 90% 90% at 50% 50%,#000,transparent);
  -webkit-mask-image:radial-gradient(ellipse 90% 90% at 50% 50%,#000,transparent);
  opacity:0.45;
}
body::after{
  content:''; position:absolute; top:-220px; right:-160px;
  width:760px; height:760px;
  background:radial-gradient(circle,rgba(176,89,58,0.22) 0%,transparent 65%);
}
.frame{
  position:relative; z-index:1; height:100%;
  padding:64px 72px;
  display:flex; align-items:center; gap:60px;
}
.left{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
.logo-row{ display:flex; align-items:center; gap:14px; margin-bottom:40px; }
.logo-tag{
  font-family:var(--font-mono); font-size:13px; font-weight:500; letter-spacing:0.12em;
  padding:5px 11px; border:1px solid rgba(250,247,238,0.25); border-radius:3px;
  color:rgba(250,247,238,0.75); white-space:nowrap;
}
.logo-name{ font-family:var(--font-serif); font-size:32px; color:var(--ink-text); }
.kicker{
  font-family:var(--font-mono); font-size:14px; color:var(--copper);
  letter-spacing:0.12em; text-transform:uppercase;
  display:inline-flex; align-items:center; gap:12px; margin-bottom:26px;
}
.kicker::after{ content:''; width:56px; height:1px; background:var(--copper); opacity:0.5; }
h1{
  font-family:var(--font-serif); font-size:56px; line-height:1.06;
  letter-spacing:-0.02em; font-weight:400; color:var(--ink-text); margin-bottom:34px;
}
h1 .accent{ color:var(--copper); font-style:italic; }
.foot-note{
  font-family:var(--font-serif); font-style:italic; font-size:21px;
  color:var(--ink-text-muted);
}
/* Right column — route sheet card, cream on ink, as in the landing hero */
.route-doc{
  position:relative; width:420px; flex-shrink:0;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--border-strong); border-radius:var(--radius);
  padding:34px;
  box-shadow:0 1px 0 rgba(0,0,0,0.2), 0 30px 60px -20px rgba(0,0,0,0.5);
}
.route-doc::before{
  content:''; position:absolute; inset:10px -10px -10px 10px;
  background:var(--surface); border:1px solid rgba(250,247,238,0.14);
  border-radius:var(--radius); z-index:-1; opacity:0.16;
}
.route-doc-head{ padding-bottom:18px; border-bottom:1px solid var(--border); margin-bottom:4px; }
.route-doc-title{
  font-family:var(--font-mono); font-size:12px; text-transform:uppercase;
  letter-spacing:0.14em; color:var(--text-muted); margin-bottom:6px;
}
.route-doc-name{ font-family:var(--font-serif); font-size:28px; color:var(--ink); line-height:1.15; }
.route-row{
  display:grid; grid-template-columns:132px 1fr; gap:14px; padding:17px 0;
  border-bottom:1px dashed var(--border); align-items:flex-start;
}
.route-row:last-of-type{ border-bottom:none; }
.route-row-label{
  font-family:var(--font-mono); font-size:11.5px; text-transform:uppercase;
  letter-spacing:0.14em; color:var(--text-muted); padding-top:4px;
}
.route-row-value{ font-size:16.5px; color:var(--ink); line-height:1.5; }
.route-row-value b{ font-weight:500; }
.route-pill{
  display:inline-flex; align-items:center; gap:8px;
  font-size:15px; font-weight:500; padding:5px 14px;
  border-radius:var(--radius-pill); background:var(--copper-soft); color:var(--copper-ink);
}
.route-pill::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--copper); }
</style>
</head>
<body>
<div class="frame">
  <div class="left">
    <div class="logo-row">
      <span class="logo-tag">MN&nbsp;/&nbsp;26</span>
      <span class="logo-name">MedNavigator</span>
    </div>
    <div class="kicker">Бесплатно · Без регистрации</div>
    <h1>Расскажите, что беспокоит — узнайте, <span class="accent">к какому врачу</span> идти</h1>
    <div class="foot-note">Не диагноз · Не назначение</div>
  </div>

  <div class="route-doc">
    <div class="route-doc-head">
      <div class="route-doc-title">Вы получите</div>
      <div class="route-doc-name">Маршрутный лист</div>
    </div>
    <div class="route-row">
      <div class="route-row-label">Жалоба</div>
      <div class="route-row-value">Головная боль, давление 140/90, лёгкая тошнота — со слов пациента</div>
    </div>
    <div class="route-row">
      <div class="route-row-label">Следующий шаг</div>
      <div class="route-row-value"><b>Терапевт</b>, очная консультация</div>
    </div>
    <div class="route-row">
      <div class="route-row-label">Срочность</div>
      <div class="route-row-value"><span class="route-pill">1–2 дня</span></div>
    </div>
  </div>
</div>
</body>
</html>
