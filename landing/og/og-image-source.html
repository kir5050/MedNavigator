<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MedNavigator — og-image source (1200×630)</title>
<!--
  Source for landing/og-image.png. All visible strings are copied verbatim
  from landing/index.html (hero + route-doc sample card). Render with:
  npx playwright screenshot --viewport-size=1200,630 landing/og/og-image-source.html landing/og-image.png
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* Tokens copied from landing/index.html */
  --bg: #EFEBE0;
  --surface: #FAF7EE;
  --ink: #1A1714;
  --copper: #B0593A;
  --copper-soft: rgba(176,89,58,0.10);
  --text-secondary: rgba(26,23,20,0.65);
  --text-muted: rgba(26,23,20,0.45);
  --border: rgba(26,23,20,0.10);
  --border-strong: rgba(26,23,20,0.22);
  --shadow-lg: 0 1px 0 rgba(26,23,20,0.05), 0 18px 36px -18px rgba(26,23,20,0.18);
  --radius: 6px;
  --radius-pill: 999px;
  --font-sans: 'Geist', system-ui, -apple-system, sans-serif;
  --font-serif: 'Instrument Serif', 'Georgia', serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}

body {
  width: 1200px;
  height: 630px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  position: relative;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Editorial grid backdrop — as in the landing hero */
body::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(26,23,20,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(26,23,20,0.04) 1px, transparent 1px);
  background-size: 96px 96px;
  background-position: -1px -1px;
  mask-image: radial-gradient(ellipse 100% 80% at 50% 0%, #000 0%, transparent 85%);
  -webkit-mask-image: radial-gradient(ellipse 100% 80% at 50% 0%, #000 0%, transparent 85%);
  opacity: 0.7;
}
body::after {
  content: '';
  position: absolute;
  top: -220px; right: -160px;
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(176,89,58,0.10) 0%, transparent 65%);
}

.frame {
  position: relative;
  z-index: 1;
  height: 100%;
  padding: 64px 72px;
  display: flex;
  align-items: center;
  gap: 64px;
}

/* Left column */
.left {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.logo-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 44px;
}
.logo-tag {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.12em;
  padding: 5px 11px;
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  color: var(--text-muted);
  white-space: nowrap;
}
.logo-name {
  font-family: var(--font-serif);
  font-size: 32px;
  letter-spacing: -0.005em;
  color: var(--ink);
}
h1 {
  font-family: var(--font-serif);
  font-size: 66px;
  line-height: 1.0;
  letter-spacing: -0.025em;
  font-weight: 400;
  color: var(--ink);
  margin-bottom: 40px;
}
h1 .accent {
  color: var(--copper);
  font-style: italic;
  white-space: nowrap;
}
.chip {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  padding: 10px 22px;
  background: rgba(26,23,20,0.05);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-pill);
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 21px;
  color: var(--text-secondary);
  white-space: nowrap;
}

/* Right column — simplified route sheet card, as in the landing hero */
.route-doc {
  position: relative;
  width: 420px;
  flex-shrink: 0;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 34px;
  box-shadow: var(--shadow-lg);
}
.route-doc::before {
  content: '';
  position: absolute;
  inset: 10px -10px -10px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  z-index: -1;
  opacity: 0.55;
}
.route-doc-head {
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}
.route-doc-title {
  font-family: var(--font-mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.route-doc-name {
  font-family: var(--font-serif);
  font-size: 28px;
  letter-spacing: -0.005em;
  color: var(--ink);
  line-height: 1.15;
}
.route-row {
  display: grid;
  grid-template-columns: 132px 1fr;
  gap: 14px;
  padding: 17px 0;
  border-bottom: 1px dashed var(--border);
  align-items: flex-start;
}
.route-row:last-of-type { border-bottom: none; }
.route-row-label {
  font-family: var(--font-mono);
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-muted);
  padding-top: 4px;
}
.route-row-value {
  font-family: var(--font-sans);
  font-size: 16.5px;
  color: var(--ink);
  line-height: 1.5;
  letter-spacing: -0.003em;
}
.route-row-value b { font-weight: 500; }
.route-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 500;
  padding: 5px 14px;
  border-radius: var(--radius-pill);
  background: var(--copper-soft);
  color: var(--copper);
}
.route-pill::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--copper);
}
</style>
</head>
<body>
<div class="frame">
  <div class="left">
    <div class="logo-row">
      <span class="logo-tag">MN&nbsp;/&nbsp;26</span>
      <span class="logo-name">MedNavigator</span>
    </div>
    <h1>Цифровой <span class="accent">первый&nbsp;шаг</span> для обращений по&nbsp;ДМС</h1>
    <span class="chip">Не диагноз · Не назначение лечения</span>
  </div>

  <div class="route-doc">
    <div class="route-doc-head">
      <div class="route-doc-title">Образец</div>
      <div class="route-doc-name">Маршрутный лист</div>
    </div>
    <div class="route-row">
      <div class="route-row-label">Жалоба</div>
      <div class="route-row-value">Головная боль, давление 140/90, лёгкая тошнота — со слов пациента</div>
    </div>
    <div class="route-row">
      <div class="route-row-label">Следующий шаг</div>
      <div class="route-row-value"><b>Терапевт</b>, очная консультация</div>
    </div>
    <div class="route-row">
      <div class="route-row-label">Срочность</div>
      <div class="route-row-value"><span class="route-pill">1–2 дня</span></div>
    </div>
  </div>
</div>
</body>
</html>
