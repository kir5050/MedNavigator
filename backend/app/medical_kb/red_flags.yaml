# Red flags — symptoms requiring IMMEDIATE emergency response (103/112)
# Checked BEFORE any LLM call, by keyword matching

red_flags:
  cardiac:
    patterns:
      - "боль в груди"
      - "давит в груди"
      - "сжимает грудь"
      - "отдает в руку"
      - "отдает в челюсть"
    message: "Боль в груди может быть признаком острого состояния сердца. Немедленно вызовите скорую помощь: 103 или 112."

  stroke:
    patterns:
      - "онемела половина лица"
      - "перекосило лицо"
      - "не двигается рука"
      - "не двигается нога"
      - "онемение половины тела"
      - "нарушилась речь"
      - "не могу говорить"
    message: "Описанные симптомы могут указывать на инсульт. Каждая минута на счету! Немедленно вызовите скорую: 103 или 112."

  breathing:
    patterns:
      - "не могу дышать"
      - "задыхаюсь"
      - "сильная одышка"
      - "дыхание останавливается"
    message: "Выраженное затруднение дыхания требует экстренной помощи. Вызовите скорую: 103 или 112."

  consciousness:
    patterns:
      - "потеря сознания"
      - "обморок"
      - "упал без сознания"
      - "не приходит в себя"
    message: "Потеря сознания — серьезный симптом, требующий экстренной помощи. Вызовите скорую: 103 или 112."

  bleeding:
    patterns:
      - "сильное кровотечение"
      - "кровотечение не останавливается"
      - "много крови"
      - "сильная кровь"
    message: "Сильное кровотечение требует экстренной помощи. Прижмите место кровотечения чистой тканью и вызовите скорую: 103 или 112."

  seizures:
    patterns:
      - "судороги"
      - "припадок"
      - "трясет все тело"
    message: "Судороги требуют экстренной медицинской помощи. Вызовите скорую: 103 или 112. Не пытайтесь удерживать человека."

  severe_pain:
    patterns:
      - "острая боль в животе"
      - "невыносимая боль"
      - "нестерпимая боль"
    message: "Острая невыносимая боль требует экстренной помощи. Вызовите скорую: 103 или 112."

  high_fever:
    patterns:
      - "температура выше 40"
      - "температура 40"
      - "температура 41"
    message: "Температура выше 40°C опасна для здоровья. Вызовите скорую: 103 или 112. До приезда — прохладные компрессы."

  suicidal:
    is_crisis: true
    patterns:
      # Direct suicide phrasings (Russian)
      - "суицид"
      - "суицидальн"
      - "самоубийств"
      - "покончить с собой"
      - "покончить с жизнью"
      - "покончить со всем"
      - "свести счёты с жизнью"
      - "свести счеты с жизнью"
      - "наложить на себя руки"
      - "убить себя"
      - "убью себя"
      - "хочу умереть"
      - "хочу сдохнуть"
      - "не хочу жить"
      - "жить не хочу"
      - "жить не хочется"
      - "не хочется жить"
      - "лучше бы я умер"
      - "лучше бы я умерла"
      - "лучше бы меня не было"
      - "зачем мне жить"
      - "нет смысла жить"
      - "устал жить"
      - "устала жить"
      - "больше не могу жить"
      - "уйти из жизни"
      # English (mixed-input safety net)
      - "suicide"
      - "suicidal"
      - "kill myself"
      - "end my life"
      - "kms"
      # Self-harm (same crisis response — telephone, lock)
      - "причинить себе вред"
      - "навредить себе"
      - "резать себя"
      - "порезать себя"
      - "вскрыть вены"
      - "вскрою вены"
    message: "Пожалуйста, обратитесь за помощью прямо сейчас. Телефон доверия: 8-800-2000-122 (бесплатно, круглосуточно). Скорая помощь: 103 или 112. Вы не одиноки, и помощь доступна."

  allergic_reaction:
    patterns:
      - "отек горла"
      - "не могу глотать и дышать"
      - "лицо опухло"
      - "язык опух"
      - "анафилаксия"
    message: "Признаки тяжелой аллергической реакции. Немедленно вызовите скорую: 103 или 112."
