  medications:
    description: |
      Common OTC/Rx medication names and trade names frequently encountered
      in Russian-language patient-facing medical conversations.
      Stem-based regex with \w* suffix handles Russian noun cases automatically
      (парацетамол / парацетамола / парацетамолу / парацетамолом).
