# Output safety patterns — strings that must not appear in user-facing LLM text.
# Loaded once at startup; no hot reload. Changes require backend restart.
#
# match_type:
#   substring  — case-insensitive substring match
#   word       — case-insensitive, requires word boundary (\b on both sides)
#   regex      — raw Python regex, case-insensitive flag applied
#
# POLICY NOTE: source-attributed diagnosis history is allowed.
# The word "диагноз" is NOT blocked globally. We block formulations where
# AI assigns a diagnosis to the patient, not factual references to prior
# medical history.

output_safety:

  diagnoses:
    description: |
      Formulations that assign a diagnosis to the patient. We block the
      FORMULATION (claim of diagnosis), not disease names themselves —
      patients may legitimately mention diseases they already have, and
      LLM may legitimately reference them in clarifications.
    match_type: substring
    patterns:
      - id: dx_002
        pattern: "у вас диагноз"
      - id: dx_003
        pattern: "ваш диагноз"
      - id: dx_004
        pattern: "вероятно, у вас"
