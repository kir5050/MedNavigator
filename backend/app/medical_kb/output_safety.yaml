  dosages:
    description: |
      Numeric dosage and frequency expressions. Stem-based suffixes (\w*)
      handle Russian noun cases (таблетка/таблетки/таблеток/таблетку).
      Decimal-aware for "0,5 мг", "2.5 мл" formats.
    match_type: regex
    patterns:
      - id: dose_001
        pattern: '\b\d+(?:[.,]\d+)?\s*(?:мг|миллиграмм\w*)\b'
      - id: dose_002
        pattern: '\b\d+(?:[.,]\d+)?\s*(?:мкг|микрограмм\w*)\b'
      - id: dose_003
        pattern: '\b\d+(?:[.,]\d+)?\s*(?:мл|миллилитр\w*)\b'
      - id: dose_004
        pattern: '\b\d+(?:[.,]\d+)?\s*(?:г|грамм\w*)\b'
      - id: dose_005
        pattern: '\b\d+\s*(?:таб\.?|таблетк\w*)\b'
      - id: dose_006
        pattern: '\b\d+\s*(?:капс\.?|капсул\w*)\b'
      - id: dose_007
        pattern: '\b\d+\s*(?:кап\.?|капл\w*)\b'
      - id: dose_008
        pattern: '\b\d+\s*раз\w*\s+в\s+(?:день|сутки|неделю|час)\b'
      - id: dose_009
        pattern: '\bпо\s+\d+\s+(?:таблетк\w*|капсул\w*|капл\w*|раз\w*)'
      - id: dose_010
        pattern: '\b(?:утром|дн[её]м|вечером|на\s+ночь)\s+и\s+(?:утром|дн[её]м|вечером|на\s+ночь)\b'
      - id: dose_011
        pattern: '\bперед\s+едой\b'
      - id: dose_012
        pattern: '\bпосле\s+еды\b'
      - id: dose_013
        pattern: '\bна\s+голодный\s+желудок\b'
      - id: dose_014
        pattern: '\bкурс\s+лечения\b'
      - id: dose_015
        pattern: '\b(?:курсом|в\s+течение)\s+\d+\s+(?:дн\w*|недел\w*|месяц\w*)'
      - id: dose_016
        pattern: '\bкаждые\s+\d+\s*(?:час\w*)\b'
      - id: dose_017
        pattern: '\b\d+\s*(?:р/д|раза?\s+в\s+день)\b'
      - id: dose_018
        pattern: '\b\d+(?:[.,]\d+)?\s*%'

  icd_codes:
    description: |
      ICD-10 codes (both Latin and Cyrillic-letter variants used in Russian
      medical records). Format: letter + 2 digits + optional .digit(s).
    match_type: regex
    patterns:
      - id: icd_001
        pattern: '\b[A-Z]\d{2}\.\d{1,2}\b'
      - id: icd_002
        pattern: '\b[А-Я]\d{2}\.\d{1,2}\b'
      - id: icd_003
        pattern: '\bмкб[\s-]*10\b'
      - id: icd_004
        pattern: '\bпо\s+мкб\b'
      - id: icd_005
        pattern: '\bкод\s+(?:заболевания|диагноза|по\s+мкб)\b'
