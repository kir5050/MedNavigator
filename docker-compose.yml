version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - sqlite-data:/app/data
      - cache-data:/app/cache
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/mednavigator.db
      - CACHE_DIR=/app/cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite-data:
  cache-data:
